<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Apple-Level Text Warp</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
    }
    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

  <script>
  (async () => {

    // -----------------------------
    // WAIT FOR FONT (critical)
    // -----------------------------
    await document.fonts.load('64px "Instrument Serif"');
    await document.fonts.ready;

    // -----------------------------
    // PIXI APP
    // -----------------------------
    const app = new PIXI.Application({
      resizeTo: window,
      backgroundColor: 0xffffff,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true
    });

    document.getElementById("container").appendChild(app.view);

    // -----------------------------
    // TEXT CONFIG
    // -----------------------------
    const lines = [
      "Product & Design System Designer",
      "Focused on scalable systems",
      "& complex platforms."
    ];

    const style = new PIXI.TextStyle({
      fontFamily: "Instrument Serif",
      fontSize: 64,
      fill: "#ff7730"
    });

    const chars = [];
    const data = [];

    // layout
    let y = 160;

    for (let line of lines) {
      let x = 120;

      for (let char of line) {
        const t = new PIXI.Text(char === " " ? " " : char, style);

        t.x = x;
        t.y = y;

        app.stage.addChild(t);

        chars.push(t);

        data.push({
          baseX: x,
          baseY: y,
          vx: 0,
          vy: 0
        });

        x += 34;
      }

      y += 92;
    }

    // -----------------------------
    // MOUSE WITH SMOOTH INERTIA
    // -----------------------------
    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const smoothMouse = { x: mouse.x, y: mouse.y };

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // -----------------------------
    // PARAMETERS (APPLE STYLE TUNED)
    // -----------------------------
    const config = {
      radius: 420,
      push: 0.55,
      scale: 0.65,
      smoothing: 0.12,
      returnEase: 0.08
    };

    // -----------------------------
    // ANIMATION LOOP
    // -----------------------------
    app.ticker.add(() => {

      // smooth cursor (lag = luxury feel)
      smoothMouse.x += (mouse.x - smoothMouse.x) * config.smoothing;
      smoothMouse.y += (mouse.y - smoothMouse.y) * config.smoothing;

      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        const d = data[i];

        const dx = d.baseX - smoothMouse.x;
        const dy = d.baseY - smoothMouse.y;

        const dist = Math.sqrt(dx * dx + dy * dy);

        const norm = Math.min(dist / config.radius, 1);

        // smooth falloff curve (Apple-style easing)
        const falloff = Math.pow(1 - norm, 3);

        // target displacement (fluid field)
        const targetVX = dx * config.push * falloff;
        const targetVY = dy * config.push * falloff;

        // spring physics (inertia)
        d.vx += (targetVX - d.vx) * config.returnEase;
        d.vy += (targetVY - d.vy) * config.returnEase;

        // apply position
        c.x = d.baseX + d.vx;
        c.y = d.baseY + d.vy;

        // depth scaling (breathing motion)
        const scale = 1 + config.scale * falloff;
        c.scale.set(scale);

        // subtle rotation (premium feel)
        c.rotation = d.vx * 0.002;
      }
    });

    // -----------------------------
    // RESIZE SAFETY
    // -----------------------------
    window.addEventListener("resize", () => {
      mouse.x = window.innerWidth / 2;
      mouse.y = window.innerHeight / 2;
    });

  })();
  </script>
</body>
</html>
