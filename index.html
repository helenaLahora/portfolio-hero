<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Adaptive Portfolio Hero</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #container {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    canvas {
      display: block;
      background: transparent !important;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  // ----------------------------
  // DEVICE MODE (MOBILE TRIGGER = <768px)
  // ----------------------------
  function getDeviceMode() {
    const w = window.innerWidth;
    if (w < 768) return "mobile";
    if (w < 1200) return "tablet";
    return "desktop";
  }

  function clamp(min, max, v) {
    return Math.max(min, Math.min(max, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function getScale() {
    return Math.min(window.innerWidth, window.innerHeight) / 1000;
  }

  function getConfig() {
    const mode = getDeviceMode();

    if (mode === "mobile") {
      return {
        radius: 420,
        push: 0.22,
        scale: 0.32,
        smoothing: 0.08,
        returnEase: 0.06,
        baseWarp: 0.08,
        motionIntensity: 0.7
      };
    }

    if (mode === "tablet") {
      return {
        radius: 620,
        push: 0.35,
        scale: 0.45,
        smoothing: 0.11,
        returnEase: 0.08,
        baseWarp: 0.12,
        motionIntensity: 0.85
      };
    }

    return {
      radius: 780,
      push: 0.42,
      scale: 0.5,
      smoothing: 0.14,
      returnEase: 0.09,
      baseWarp: 0.16,
      motionIntensity: 1
    };
  }

  const reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  await document.fonts.load('64px "Instrument Serif"');
  await document.fonts.ready;

  // ----------------------------
  // PIXI (TRANSPARENT)
  // ----------------------------
  const app = new PIXI.Application({
    resizeTo: window,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
    backgroundAlpha: 0,
    backgroundColor: 0x000000
  });

  document.getElementById("container").appendChild(app.view);

  // ----------------------------
  // TEXT
  // ----------------------------
  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  function getFontSize() {
    const base = Math.min(app.screen.width, app.screen.height);
    return clamp(22, 72, base * 0.055);
  }

  function createStyle() {
    const s = getScale();

    return new PIXI.TextStyle({
      fontFamily: "Instrument Serif",
      fontSize: getFontSize(),
      letterSpacing: clamp(0, 2.5, 1.2 * s),
      fill: "#ff7730"
    });
  }

  function getLineHeight() {
    const s = getScale();
    return clamp(28, 90, 70 * s);
  }

  let config = getConfig();
  let targetConfig = getConfig();

  const chars = [];
  const data = [];

  // ----------------------------
  // POINTER SYSTEM (DESKTOP + MOBILE + AMBIENT)
  // ----------------------------
  const pointer = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    active: false
  };

  const smooth = { x: pointer.x, y: pointer.y };

  // desktop
  window.addEventListener("mousemove", (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });

  // mobile touch
  window.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    if (!t) return;

    pointer.x = t.clientX;
    pointer.y = t.clientY;
    pointer.active = true;
  });

  window.addEventListener("touchend", () => {
    pointer.active = false;
  });

  // ambient fallback for mobile idle
  function updateAmbientPointer() {
    if (pointer.active) return;

    const t = performance.now() * 0.0003;

    pointer.x =
      window.innerWidth / 2 +
      Math.sin(t * 1.2) * window.innerWidth * 0.25;

    pointer.y =
      window.innerHeight / 2 +
      Math.cos(t * 0.9) * window.innerHeight * 0.2;
  }

  // ----------------------------
  // WARP FUNCTIONS
  // ----------------------------
  function smoothWave(x, t) {
    return Math.sin(x * 0.06 + t * 0.5) * 0.7 +
           Math.sin(x * 0.015 + t * 0.25) * 0.3;
  }

  function getForce(dx, dy) {
    const dist = Math.sqrt(dx * dx + dy * dy);
    const norm = Math.min(dist / config.radius, 1);
    const falloff = Math.pow(1 - norm, 3);

    return {
      x: dx * config.push * falloff,
      y: dy * config.push * falloff,
      falloff
    };
  }

  let time = 0;

  // ----------------------------
  // BUILD TEXT
  // ----------------------------
  function buildText() {

    for (let c of chars) app.stage.removeChild(c);

    chars.length = 0;
    data.length = 0;

    const style = createStyle();
    const lineHeight = getLineHeight();

    const totalHeight = (lines.length - 1) * lineHeight;

    for (let i = 0; i < lines.length; i++) {

      const line = lines[i];

      let totalWidth = 0;

      for (let c of line) {
        const t = new PIXI.Text(c === " " ? " " : c, style);
        totalWidth += t.width;
      }

      let x = app.screen.width / 2 - totalWidth / 2;

      let y =
        app.screen.height / 2 -
        totalHeight / 2 +
        i * lineHeight;

      for (let j = 0; j < line.length; j++) {

        const char = line[j];

        const t = new PIXI.Text(char === " " ? " " : char, style);

        t.x = x;
        t.y = y;

        app.stage.addChild(t);

        chars.push(t);

        data.push({
          baseX: x,
          baseY: y,
          vx: 0,
          vy: 0
        });

        x += t.width;
      }
    }
  }

  buildText();

  // ----------------------------
  // RESIZE + MODE SWITCH
  // ----------------------------
  window.addEventListener("resize", () => {
    app.renderer.resize(window.innerWidth, window.innerHeight);
    targetConfig = getConfig();
    buildText();
  });

  // ----------------------------
  // LOOP (FULL SYSTEM)
  // ----------------------------
  app.ticker.add(() => {

    time += reduceMotion ? 0.002 : 0.01;

    updateAmbientPointer();

    const motionFactor =
      (reduceMotion ? 0.15 : 1) * config.motionIntensity;

    smooth.x += (pointer.x - smooth.x) * config.smoothing;
    smooth.y += (pointer.y - smooth.y) * config.smoothing;

    // smooth config transitions
    config.radius = lerp(config.radius, targetConfig.radius, 0.08);
    config.push = lerp(config.push, targetConfig.push, 0.08);
    config.scale = lerp(config.scale, targetConfig.scale, 0.08);
    config.baseWarp = lerp(config.baseWarp, targetConfig.baseWarp, 0.08);
    config.motionIntensity = lerp(
      config.motionIntensity,
      targetConfig.motionIntensity,
      0.08
    );

    for (let i = 0; i < chars.length; i++) {

      const c = chars[i];
      const d = data[i];

      const lineIndex = Math.floor(i / 40);

      const wave =
        smoothWave(lineIndex * 10, time);

      const drift =
        Math.sin(i * 0.1 + time) * 2;

      const baseX = wave * 6 * config.baseWarp;
      const baseY = drift * config.baseWarp;

      const fx = getForce(
        d.baseX - smooth.x,
        d.baseY - smooth.y
      );

      d.vx += (fx.x - d.vx) * config.returnEase;
      d.vy += (fx.y - d.vy) * config.returnEase;

      c.x = d.baseX + d.vx + baseX;
      c.y = d.baseY + d.vy + baseY;

      c.scale.set(1 + config.scale * fx.falloff * motionFactor);

      c.rotation = d.vx * 0.002 * motionFactor;
    }
  });

})();
</script>
</body>
</html>
