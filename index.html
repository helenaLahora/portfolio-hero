<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stable Apple Warp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
    }
    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  await document.fonts.load('64px "Instrument Serif"');
  await document.fonts.ready;

  const app = new PIXI.Application({
    resizeTo: window,
    backgroundColor: 0xffffff,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });

  document.getElementById("container").appendChild(app.view);

  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  const style = new PIXI.TextStyle({
    fontFamily: "Instrument Serif",
    fontSize: 64,
    fill: "#ff7730"
  });

  const chars = [];
  const data = [];

  // ----------------------------
  // CENTER LAYOUT
  // ----------------------------
  const lineHeight = 92;
  const startY = app.screen.height / 2 - (lines.length * lineHeight) / 2;

  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    let totalWidth = 0;
    const temp = [];

    for (let c of line) {
      const t = new PIXI.Text(c === " " ? " " : c, style);
      totalWidth += t.width;
      temp.push(t);
    }

    let x = app.screen.width / 2 - totalWidth / 2;
    let y = startY + i * lineHeight;

    for (let j = 0; j < line.length; j++) {
      const char = line[j];

      const t = new PIXI.Text(char === " " ? " " : char, style);

      app.stage.addChild(t);

      chars.push(t);

      data.push({
        baseX: x,
        baseY: y,
        vx: 0,
        vy: 0
      });

      x += t.width;
    }
  }

  // ----------------------------
  // MOUSE
  // ----------------------------
  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const smooth = { x: mouse.x, y: mouse.y };

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // ----------------------------
  // CONFIG
  // ----------------------------
  const config = {
    radius: 420,
    push: 0.55,
    scale: 0.6,
    smoothing: 0.12,
    returnEase: 0.08,
    baseWarp: 0.22 // IMPORTANT: true pre-warp strength
  };

  // ----------------------------
  // STABLE NOISE FUNCTION (deterministic)
  // ----------------------------
  function noise(i, axis) {
    return Math.sin(i * 12.9898 + axis * 78.233) * 0.5 + 0.5;
  }

  // ----------------------------
  // LOOP
  // ----------------------------
  app.ticker.add(() => {

    smooth.x += (mouse.x - smooth.x) * config.smoothing;
    smooth.y += (mouse.y - smooth.y) * config.smoothing;

    for (let i = 0; i < chars.length; i++) {

      const c = chars[i];
      const d = data[i];

      // ----------------------------
      // BASE WARP (always active)
      // ----------------------------
      const baseX =
        (noise(i, 1) - 0.5) * 18 * config.baseWarp;

      const baseY =
        (noise(i, 2) - 0.5) * 18 * config.baseWarp;

      // ----------------------------
      // CURSOR FIELD
      // ----------------------------
      const dx = d.baseX - smooth.x;
      const dy = d.baseY - smooth.y;

      const dist = Math.sqrt(dx * dx + dy * dy);

      const norm = Math.min(dist / config.radius, 1);
      const falloff = Math.pow(1 - norm, 3);

      const tx = dx * config.push * falloff;
      const ty = dy * config.push * falloff;

      d.vx += (tx - d.vx) * config.returnEase;
      d.vy += (ty - d.vy) * config.returnEase;

      // ----------------------------
      // FINAL POSITION
      // ----------------------------
      c.x = d.baseX + d.vx + baseX;
      c.y = d.baseY + d.vy + baseY;

      const scale = 1 + config.scale * falloff;
      c.scale.set(scale);

      c.rotation = d.vx * 0.002;
    }
  });

})();
</script>
</body>
</html>
