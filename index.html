<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Centered Apple Warp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
    }

    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  // ----------------------------
  // FONT LOAD
  // ----------------------------
  await document.fonts.load('64px "Instrument Serif"');
  await document.fonts.ready;

  // ----------------------------
  // PIXI APP
  // ----------------------------
  const app = new PIXI.Application({
    resizeTo: window,
    backgroundColor: 0xffffff,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });

  document.getElementById("container").appendChild(app.view);

  // ----------------------------
  // TEXT
  // ----------------------------
  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  const style = new PIXI.TextStyle({
    fontFamily: "Instrument Serif",
    fontSize: 64,
    fill: "#ff7730"
  });

  const chars = [];
  const data = [];

  const lineContainers = [];

  // ----------------------------
  // BUILD CENTERED LAYOUT
  // ----------------------------
  const startY = 0;

  for (let i = 0; i < lines.length; i++) {

    const line = new PIXI.Container();
    const lineChars = [];

    let totalWidth = 0;

    // first pass: create chars + measure width
    for (let char of lines[i]) {
      const t = new PIXI.Text(char === " " ? " " : char, style);

      line.addChild(t);
      lineChars.push(t);

      totalWidth += t.width;
    }

    // center line horizontally
    let x = -totalWidth / 2;
    const y = startY + i * 92;

    for (let j = 0; j < lineChars.length; j++) {
      const t = lineChars[j];

      t.x = x;
      t.y = y;

      data.push({
        baseX: x,
        baseY: y,
        vx: 0,
        vy: 0
      });

      chars.push(t);

      x += t.width; // NATURAL kerning (no fake spacing)
    }

    line.x = app.screen.width / 2;
    line.y = app.screen.height / 2;

    app.stage.addChild(line);
    lineContainers.push(line);
  }

  // ----------------------------
  // MOUSE
  // ----------------------------
  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const smooth = { x: mouse.x, y: mouse.y };

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // ----------------------------
  // MOTION CONFIG (Apple feel)
  // ----------------------------
  const config = {
    radius: 420,
    push: 0.55,
    scale: 0.6,
    smoothing: 0.12,
    returnEase: 0.08
  };

  // ----------------------------
  // LOOP
  // ----------------------------
  app.ticker.add(() => {

    // smooth cursor
    smooth.x += (mouse.x - smooth.x) * config.smoothing;
    smooth.y += (mouse.y - smooth.y) * config.smoothing;

    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const d = data[i];

      const dx = d.baseX + app.screen.width / 2 - smooth.x;
      const dy = d.baseY + app.screen.height / 2 - smooth.y;

      const dist = Math.sqrt(dx * dx + dy * dy);

      const norm = Math.min(dist / config.radius, 1);
      const falloff = Math.pow(1 - norm, 3);

      const targetX = dx * config.push * falloff;
      const targetY = dy * config.push * falloff;

      d.vx += (targetX - d.vx) * config.returnEase;
      d.vy += (targetY - d.vy) * config.returnEase;

      const baseX = d.baseX + app.screen.width / 2;
      const baseY = d.baseY + app.screen.height / 2;

      c.x = baseX + d.vx;
      c.y = baseY + d.vy;

      const scale = 1 + config.scale * falloff;
      c.scale.set(scale);

      c.rotation = d.vx * 0.002;
    }
  });

})();
</script>
</body>
</html>
