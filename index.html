<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Apple Motion Typography (Clean)</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
    }

    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  // ----------------------------
  // ACCESSIBILITY
  // ----------------------------
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  await document.fonts.load('64px "Instrument Serif"');
  await document.fonts.ready;

  const app = new PIXI.Application({
    resizeTo: window,
    backgroundColor: 0xffffff,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });

  document.getElementById("container").appendChild(app.view);

  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  const style = new PIXI.TextStyle({
    fontFamily: "Instrument Serif",
    fontSize: 64,
    fill: "#ff7730"
  });

  const chars = [];
  const data = [];

  // ----------------------------
  // LAYOUT SETTINGS (tighter spacing)
  // ----------------------------
  const lineHeight = 70; // 👈 reduced spacing (Apple-style compact)

  const startY =
    app.screen.height / 2 -
    ((lines.length - 1) * lineHeight) / 2;

  // ----------------------------
  // BUILD CENTERED TEXT
  // ----------------------------
  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    let totalWidth = 0;

    for (let c of line) {
      const t = new PIXI.Text(c === " " ? " " : c, style);
      totalWidth += t.width;
    }

    let x = app.screen.width / 2 - totalWidth / 2;
    let y = startY + i * lineHeight;

    for (let j = 0; j < line.length; j++) {

      const char = line[j];

      const t = new PIXI.Text(char === " " ? " " : char, style);

      t.x = x;
      t.y = y;

      app.stage.addChild(t);

      chars.push(t);

      data.push({
        baseX: x,
        baseY: y,
        vx: 0,
        vy: 0
      });

      x += t.width;
    }
  }

  // ----------------------------
  // MOUSE
  // ----------------------------
  const mouse = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2
  };

  const smooth = { x: mouse.x, y: mouse.y };

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // ----------------------------
  // CONFIG (Apple-style tuned)
  // ----------------------------
  const config = {
    radius: 420,
    push: 0.55,
    scale: 0.6,
    smoothing: 0.12,
    returnEase: 0.08,
    baseWarp: 0.18
  };

  // ----------------------------
  // STRUCTURED BASE WARP (stable + aesthetic)
  // ----------------------------
  function smoothWave(x, t) {
    return Math.sin(x * 0.08 + t * 0.6) * 0.6 +
           Math.sin(x * 0.02 + t * 0.3) * 0.4;
  }

  let time = 0;

  // ----------------------------
  // ANIMATION LOOP
  // ----------------------------
  app.ticker.add(() => {

    time += reduceMotion ? 0.002 : 0.01;

    const motionFactor = reduceMotion ? 0.15 : 1;

    smooth.x += (mouse.x - smooth.x) * (reduceMotion ? 0.05 : config.smoothing);
    smooth.y += (mouse.y - smooth.y) * (reduceMotion ? 0.05 : config.smoothing);

    for (let i = 0; i < chars.length; i++) {

      const c = chars[i];
      const d = data[i];

      // ----------------------------
      // BASE WARP (structured motion field)
      // ----------------------------
      const lineIndex = Math.floor(i / 40);

      const wave =
        smoothWave(lineIndex * 10, time);

      const drift =
        Math.sin(i * 0.12 + time) * 2;

      const baseX = wave * 6 * config.baseWarp;
      const baseY = drift * config.baseWarp;

      // ----------------------------
      // CURSOR FIELD
      // ----------------------------
      const dx = d.baseX - smooth.x;
      const dy = d.baseY - smooth.y;

      const dist = Math.sqrt(dx * dx + dy * dy);

      const norm = Math.min(dist / config.radius, 1);
      const falloff = Math.pow(1 - norm, 3);

      const tx = dx * config.push * falloff * motionFactor;
      const ty = dy * config.push * falloff * motionFactor;

      d.vx += (tx - d.vx) * config.returnEase;
      d.vy += (ty - d.vy) * config.returnEase;

      // ----------------------------
      // FINAL POSITION
      // ----------------------------
      c.x = d.baseX + d.vx + baseX;
      c.y = d.baseY + d.vy + baseY;

      c.scale.set(1 + config.scale * falloff * motionFactor);

      c.rotation = d.vx * 0.002 * motionFactor;
    }
  });

})();
</script>
</body>
</html>
