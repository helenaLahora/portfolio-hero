<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Adaptive Motion Hero</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    #container {
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    canvas {
      display: block;
      background: transparent !important;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  // ----------------------------
  // FORCE TRANSPARENCY (CRITICAL FOR MOBILE + IFRAMES)
  // ----------------------------
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";

  // ----------------------------
  // PIXI INIT (NO WHITE BACKGROUND EVER)
  // ----------------------------
  const app = new PIXI.Application({
    resizeTo: window,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
    backgroundAlpha: 0,
    backgroundColor: 0x000000,
    transparent: true,
    clearBeforeRender: true,
    powerPreference: "high-performance"
  });

  document.getElementById("container").appendChild(app.view);

  // ----------------------------
  // TEXT DATA
  // ----------------------------
  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  // ----------------------------
  // RESPONSIVE TYPOGRAPHY
  // ----------------------------
  function clamp(min, max, v) {
    return Math.max(min, Math.min(max, v));
  }

  function getScale() {
    const base = Math.max(320, Math.min(window.innerWidth, window.innerHeight));
    return clamp(0.6, 1.4, base / 900);
  }

  function getFontSize() {
    return clamp(22, 72, 64 * getScale());
  }

  function getLetterSpacing() {
    return clamp(0, 3, 1.2 * getScale());
  }

  function createStyle() {
    return new PIXI.TextStyle({
      fontFamily: "Instrument Serif",
      fontSize: getFontSize(),
      letterSpacing: getLetterSpacing(),
      fill: "#ff7730",
      padding: 24
    });
  }

  function getLineHeight() {
    const t = new PIXI.Text("Mg", createStyle());
    const h = t.height * 1.15;
    t.destroy();
    return h;
  }

  function getMaxWidth() {
    return window.innerWidth * 0.88;
  }

  function getSafePaddingY() {
    return Math.max(60, window.innerHeight * 0.22);
  }

  // ----------------------------
  // SAFE MEASUREMENT SYSTEM (CRITICAL FIX)
  // ----------------------------
  function measureChar(ch, style) {
    const t = new PIXI.Text(ch === " " ? " " : ch, style);

    app.stage.addChild(t);
    t.updateTransform();

    const w = t.getBounds().width;

    app.stage.removeChild(t);
    t.destroy();

    return w;
  }

  function measureLine(line, style) {
    let width = 0;
    for (let ch of line) {
      width += measureChar(ch, style);
    }
    return width;
  }

  // ----------------------------
  // STATE
  // ----------------------------
  let chars = [];
  let data = [];
  let time = 0;

  let config = getConfig();
  let targetConfig = getConfig();

  function getConfig() {
    const w = window.innerWidth;

    if (w < 768) {
      return { radius: 420, push: 0.22, scale: 0.32, smoothing: 0.08, returnEase: 0.06, baseWarp: 0.08, motionIntensity: 0.7 };
    }

    if (w < 1200) {
      return { radius: 620, push: 0.35, scale: 0.45, smoothing: 0.11, returnEase: 0.08, baseWarp: 0.12, motionIntensity: 0.85 };
    }

    return { radius: 780, push: 0.42, scale: 0.5, smoothing: 0.14, returnEase: 0.09, baseWarp: 0.16, motionIntensity: 1 };
  }

  // ----------------------------
  // POINTER
  // ----------------------------
  const pointer = { x: innerWidth/2, y: innerHeight/2, active:false };
  const smooth = { x:pointer.x, y:pointer.y };

  window.addEventListener("mousemove", e => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });

  window.addEventListener("touchmove", e => {
    const t = e.touches[0];
    if (!t) return;
    pointer.x = t.clientX;
    pointer.y = t.clientY;
    pointer.active = true;
  });

  function updateAmbient() {
    if (pointer.active) return;
    const t = performance.now() * 0.0003;
    pointer.x = innerWidth/2 + Math.sin(t*1.2)*innerWidth*0.25;
    pointer.y = innerHeight/2 + Math.cos(t*0.9)*innerHeight*0.2;
  }

  function smoothWave(x,t){
    return Math.sin(x*0.06+t*0.5)*0.7 + Math.sin(x*0.015+t*0.25)*0.3;
  }

  function getForce(dx,dy){
    const d=Math.sqrt(dx*dx+dy*dy);
    const n=Math.min(d/config.radius,1);
    const f=Math.pow(1-n,3);
    return {x:dx*config.push*f,y:dy*config.push*f,f};
  }

  // ----------------------------
  // BUILD TEXT (FULL FIXED LAYOUT ENGINE)
  // ----------------------------
  function buildText() {

    for (let c of chars) app.stage.removeChild(c);

    chars = [];
    data = [];

    const style = createStyle();
    const lineHeight = getLineHeight();
    const maxWidth = getMaxWidth();

    let wrapped = [];

    // WORD WRAP (SAFE)
    for (let line of lines) {
      const words = line.split(" ");
      let current = "";

      for (let w of words) {
        const test = current + w + " ";

        const temp = new PIXI.Text(test, style);
        app.stage.addChild(temp);
        temp.updateTransform();

        const width = temp.getBounds().width;

        app.stage.removeChild(temp);
        temp.destroy();

        if (width > maxWidth && current !== "") {
          wrapped.push(current);
          current = w + " ";
        } else {
          current = test;
        }
      }

      wrapped.push(current);
    }

    const totalHeight = (wrapped.length - 1) * lineHeight;

    const padding = getSafePaddingY();
    const usableHeight = window.innerHeight - padding * 2;

    const startY =
      padding +
      usableHeight / 2 -
      totalHeight / 2;

    // RENDER
    for (let i = 0; i < wrapped.length; i++) {

      const line = wrapped[i];
      const lineWidth = measureLine(line, style);

      let x = window.innerWidth / 2 - lineWidth / 2;
      let y = startY + i * lineHeight;

      for (let ch of line) {

        const t = new PIXI.Text(ch === " " ? " " : ch, style);

        t.x = x;
        t.y = y;

        app.stage.addChild(t);

        chars.push(t);
        data.push({ baseX: x, baseY: y, vx: 0, vy: 0 });

        x += measureChar(ch, style);
      }
    }
  }

  buildText();

  // ----------------------------
  // RESIZE SAFE REBUILD
  // ----------------------------
  window.addEventListener("resize", () => {
    app.renderer.resize(window.innerWidth, window.innerHeight);
    targetConfig = getConfig();

    requestAnimationFrame(() => {
      requestAnimationFrame(buildText);
    });
  });

  // ----------------------------
  // LOOP
  // ----------------------------
  app.ticker.add(() => {

    time += 0.01;

    updateAmbient();

    const motion = (1) * config.motionIntensity;

    smooth.x += (pointer.x - smooth.x) * config.smoothing;
    smooth.y += (pointer.y - smooth.y) * config.smoothing;

    for (let i = 0; i < chars.length; i++) {

      const c = chars[i];
      const d = data[i];

      const wave = smoothWave(i * 0.2, time);
      const drift = Math.sin(i * 0.1 + time) * 2;

      const bx = wave * 6 * config.baseWarp;
      const by = drift * config.baseWarp;

      const f = getForce(d.baseX - smooth.x, d.baseY - smooth.y);

      d.vx += (f.x - d.vx) * config.returnEase;
      d.vy += (f.y - d.vy) * config.returnEase;

      c.x = d.baseX + d.vx + bx;
      c.y = d.baseY + d.vy + by;

      c.scale.set(1 + config.scale * f.f * motion);
      c.rotation = d.vx * 0.002 * motion;
    }

  });

})();
</script>

</body>
</html>
