<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pre-Warp Apple Motion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
    }
    #container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>

<script>
(async () => {

  await document.fonts.load('64px "Instrument Serif"');
  await document.fonts.ready;

  const app = new PIXI.Application({
    resizeTo: window,
    backgroundColor: 0xffffff,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });

  document.getElementById("container").appendChild(app.view);

  const lines = [
    "Product & Design System Designer",
    "Focused on scalable systems",
    "& complex platforms."
  ];

  const style = new PIXI.TextStyle({
    fontFamily: "Instrument Serif",
    fontSize: 64,
    fill: "#ff7730"
  });

  const chars = [];
  const data = [];

  // ----------------------------
  // CENTER LAYOUT
  // ----------------------------
  const lineHeight = 92;
  const startY = app.screen.height / 2 - (lines.length * lineHeight) / 2;

  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    let totalWidth = 0;
    const temp = [];

    for (let c of line) {
      const t = new PIXI.Text(c === " " ? " " : c, style);
      totalWidth += t.width;
      temp.push(t);
    }

    let x = app.screen.width / 2 - totalWidth / 2;
    let y = startY + i * lineHeight;

    for (let j = 0; j < line.length; j++) {
      const char = line[j];

      const t = new PIXI.Text(char === " " ? " " : char, style);

      t.x = x;
      t.y = y;

      app.stage.addChild(t);

      chars.push(t);

      data.push({
        baseX: x,
        baseY: y,
        vx: 0,
        vy: 0
      });

      x += t.width;
    }
  }

  // ----------------------------
  // MOUSE
  // ----------------------------
  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const smooth = { x: mouse.x, y: mouse.y };

  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // ----------------------------
  // CONFIG
  // ----------------------------
  const config = {
    radius: 420,
    push: 0.55,
    scale: 0.6,
    smoothing: 0.12,
    returnEase: 0.08,

    // NEW: baseline deformation strength
    prewarp: 0.18
  };

  // ----------------------------
  // SYNTHETIC CURSOR (for pre-warp motion)
  // ----------------------------
  let t = 0;

  function getFakeCursor() {
    const cx = app.screen.width / 2;
    const cy = app.screen.height / 2;

    return {
      x: cx + Math.cos(t) * 180,
      y: cy + Math.sin(t * 1.3) * 90
    };
  }

  // ----------------------------
  // LOOP
  // ----------------------------
  app.ticker.add(() => {

    t += 0.01;

    const fake = getFakeCursor();

    smooth.x += (mouse.x - smooth.x) * config.smoothing;
    smooth.y += (mouse.y - smooth.y) * config.smoothing;

    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const d = data[i];

      // blend real + fake cursor
      const mx = smooth.x * 0.75 + fake.x * 0.25;
      const my = smooth.y * 0.75 + fake.y * 0.25;

      const dx = d.baseX - mx;
      const dy = d.baseY - my;

      const dist = Math.sqrt(dx * dx + dy * dy);

      const norm = Math.min(dist / config.radius, 1);
      const falloff = Math.pow(1 - norm, 3);

      const tx = dx * config.push * falloff;
      const ty = dy * config.push * falloff;

      // PRE-WARP BIAS (key feature)
      d.vx += (tx * config.prewarp - d.vx) * config.returnEase;
      d.vy += (ty * config.prewarp - d.vy) * config.returnEase;

      c.x = d.baseX + d.vx;
      c.y = d.baseY + d.vy;

      c.scale.set(1 + config.scale * falloff * config.prewarp);

      c.rotation = d.vx * 0.002;
    }
  });

})();
</script>
</body>
</html>
