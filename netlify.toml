[build]
  command = "npm run build"
  publish = ".next"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.figma.com https://*.figma.site https://www.figma.com https://notion.so https://*.notion.site https://*.notion.so https://webflow.com https://*.webflow.io"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
